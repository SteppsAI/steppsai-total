<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Area - Stepps.ai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: crosshair;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #screenshot {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        #selection {
            position: absolute;
            border: 2px solid #6366F1;
            background: rgba(99, 102, 241, 0.15);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            display: none;
        }

        #instructions {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
        }

        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 12px;
            z-index: 1000;
        }

        #buttons button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        #confirmBtn {
            background: #6366F1;
            color: white;
        }

        #confirmBtn:hover {
            background: #5558DD;
        }

        #cancelBtn {
            background: white;
            color: #374151;
            border: 1px solid #D1D5DB;
        }

        #cancelBtn:hover {
            background: #F3F4F6;
        }

        #fullScreenBtn {
            background: #10B981;
            color: white;
        }

        #fullScreenBtn:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <img id="screenshot" alt="Screenshot" />
    <div id="overlay"></div>
    <div id="selection"></div>
    <div id="instructions">Click and drag to select an area, or click "Full Screen" to capture everything</div>
    <div id="buttons">
        <button id="cancelBtn">Cancel</button>
        <button id="fullScreenBtn">Full Screen</button>
        <button id="confirmBtn">Capture Selection</button>
    </div>
    <script type="module" src="./src/selection-overlay/index.ts"></script>
</body>
</html>
